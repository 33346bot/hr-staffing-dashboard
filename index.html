:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {

  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {

  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {

  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {

  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {

}

.table.table-sm :is(th, td) {

}

.table.table-sm :is(th, td):not(:last-child) {

}

.table :is(.text-end, [align=&quot;right&quot;]) {

  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

.text-muted {

}

.sr-only {

  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;

  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;

.btn,
.form-check-input,
.form-control,

.btn {

  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);

  padding: 0 8px;

  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;

  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);

.form-check {

  min-height: 20px;
  align-items: center;
  gap: 6px;

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:

    border-color 150ms,
    box-shadow 150ms;

  background-color: var(--secondary);

  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;hr-staffing-prototype&quot; class=&quot;hrp-root&quot;&gt;
&lt;style&gt;
#hr-staffing-prototype {
  --hr-bg: light-dark(#f4f6fb,#101318);
  --hr-surface: light-dark(#ffffff,#191d24);
  --hr-soft: light-dark(#f7f9fc,#202631);
  --hr-line: light-dark(#dce3ee,#343b49);
  --hr-text: light-dark(#111827,#edf1f7);
  --hr-muted: light-dark(#667085,#a7b0bd);
  --hr-blue: light-dark(#2458b8,#7eafff);
  --hr-blue-soft: light-dark(#eaf1ff,#1e2c45);
  --hr-red: light-dark(#c43b3b,#ff8a8a);
  --hr-amber: light-dark(#a86500,#f7bf5b);
  color: var(--hr-text);
  background: var(--hr-bg);
  border: 1px solid var(--hr-line);
  border-radius: 12px;
  overflow: hidden;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;
}
#hr-staffing-prototype * { box-sizing: border-box; }
#hr-staffing-prototype button, #hr-staffing-prototype select { font: inherit; }
#hr-staffing-prototype .hidden { display: none !important; }
#hr-staffing-prototype .topbar {
  padding: 20px 22px 16px;
  background: linear-gradient(135deg, color-mix(in srgb,var(--hr-blue) 14%,var(--hr-surface)), var(--hr-surface));
  border-bottom: 1px solid var(--hr-line);
}
#hr-staffing-prototype .title-row { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; }
#hr-staffing-prototype h1 { margin:0; font-size:21px; font-weight:600; letter-spacing:.2px; }
#hr-staffing-prototype h2 { margin:0; font-size:16px; font-weight:600; }
#hr-staffing-prototype p { margin:4px 0 0; }
#hr-staffing-prototype .muted { color: var(--hr-muted); font-size:13px; }
#hr-staffing-prototype .date-pill { white-space:nowrap; border:1px solid var(--hr-line); background:var(--hr-surface); border-radius:999px; padding:7px 10px; font-size:13px; color:var(--hr-muted); }
#hr-staffing-prototype .tabs { display:flex; gap:8px; padding:12px 22px 0; flex-wrap:wrap; }
#hr-staffing-prototype .tab, #hr-staffing-prototype .action {
  border:1px solid var(--hr-line);
  background:var(--hr-surface);
  color:var(--hr-text);
  border-radius:999px;
  padding:8px 12px;
  cursor:pointer;
}
#hr-staffing-prototype .tab[aria-pressed=&quot;true&quot;] { background:var(--hr-blue); color:#fff; border-color:var(--hr-blue); }
#hr-staffing-prototype .content { padding:18px 22px 22px; }
#hr-staffing-prototype .toolbar { display:flex; justify-content:space-between; gap:12px; align-items:flex-end; flex-wrap:wrap; margin-bottom:14px; }
#hr-staffing-prototype .filters { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
#hr-staffing-prototype .toolbar-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
#hr-staffing-prototype .action.back-primary { background:var(--hr-blue); color:#fff; border-color:var(--hr-blue); box-shadow:0 6px 16px color-mix(in srgb,var(--hr-blue) 24%,transparent); }
#hr-staffing-prototype .action.back-secondary { border-color:color-mix(in srgb,var(--hr-blue) 45%,var(--hr-line)); color:var(--hr-blue); background:color-mix(in srgb,var(--hr-blue) 8%,var(--hr-surface)); }
#hr-staffing-prototype label { display:grid; gap:5px; font-size:12px; color:var(--hr-muted); }
#hr-staffing-prototype select { min-width:136px; border:1px solid var(--hr-line); background:var(--hr-surface); color:var(--hr-text); border-radius:9px; padding:7px 28px 7px 9px; }
#hr-staffing-prototype .kpis { display:grid; grid-template-columns:repeat(6,minmax(108px,1fr)); gap:10px; margin-bottom:16px; }
#hr-staffing-prototype .kpi { background:var(--hr-surface); border:1px solid var(--hr-line); border-radius:12px; padding:12px; min-height:84px; }
#hr-staffing-prototype .kpi span { display:block; font-size:12px; color:var(--hr-muted); margin-bottom:8px; }
#hr-staffing-prototype .kpi strong { font-size:24px; font-weight:600; font-variant-numeric:tabular-nums; }
#hr-staffing-prototype .kpi small { display:block; margin-top:5px; color:var(--hr-muted); font-size:12px; }
#hr-staffing-prototype .danger strong, #hr-staffing-prototype .danger-text { color:var(--hr-red); }
#hr-staffing-prototype .home-layout { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:14px; align-items:start; }
#hr-staffing-prototype .right-rail { display:grid; gap:14px; }
#hr-staffing-prototype .section { background:var(--hr-surface); border:1px solid var(--hr-line); border-radius:12px; overflow:hidden; }
#hr-staffing-prototype .section-head { padding:14px 15px; border-bottom:1px solid var(--hr-line); display:flex; justify-content:space-between; gap:12px; align-items:center; }
#hr-staffing-prototype .section-head p { color:var(--hr-muted); font-size:12px; }
#hr-staffing-prototype .port-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; padding:14px; }
#hr-staffing-prototype .port-card {
  text-align:left;
  border:1px solid var(--hr-line);
  background:linear-gradient(180deg,var(--hr-surface),var(--hr-soft));
  color:var(--hr-text);
  border-radius:14px;
  padding:14px;
  cursor:pointer;
  min-height:150px;
}
#hr-staffing-prototype .port-card:hover { border-color:color-mix(in srgb,var(--hr-blue) 56%,var(--hr-line)); background:var(--hr-blue-soft); }
#hr-staffing-prototype .port-head { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; margin-bottom:12px; }
#hr-staffing-prototype .port-name { font-size:17px; font-weight:600; }
#hr-staffing-prototype .port-rate { font-size:24px; font-weight:600; color:var(--hr-blue); }
#hr-staffing-prototype .port-metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
#hr-staffing-prototype .mini { display:grid; gap:2px; }
#hr-staffing-prototype .mini span { color:var(--hr-muted); font-size:12px; }
#hr-staffing-prototype .mini strong { font-weight:600; font-variant-numeric:tabular-nums; }
#hr-staffing-prototype .movement-stack { display:grid; gap:12px; padding:14px; }
#hr-staffing-prototype .movement-card { border:1px solid var(--hr-line); border-radius:12px; background:var(--hr-soft); overflow:hidden; }
#hr-staffing-prototype .movement-card-head { padding:12px; display:flex; justify-content:space-between; gap:10px; align-items:flex-start; border-bottom:1px solid var(--hr-line); }
#hr-staffing-prototype .movement-card-title { font-size:14px; font-weight:600; }
#hr-staffing-prototype .movement-total { color:var(--hr-blue); font-size:22px; font-weight:600; line-height:1; font-variant-numeric:tabular-nums; }
#hr-staffing-prototype .movement-list { display:grid; }
#hr-staffing-prototype .movement-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; padding:10px 12px; border-bottom:1px solid var(--hr-line); }
#hr-staffing-prototype .movement-row:last-child { border-bottom:0; }
#hr-staffing-prototype .movement-main { min-width:0; }
#hr-staffing-prototype .movement-pos { font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#hr-staffing-prototype .movement-org { color:var(--hr-muted); font-size:12px; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#hr-staffing-prototype .movement-count { align-self:center; font-weight:600; font-variant-numeric:tabular-nums; }
#hr-staffing-prototype .trend { padding:14px; min-height:196px; display:grid; align-items:center; }
#hr-staffing-prototype .trend-box { border:1px dashed var(--hr-line); border-radius:12px; min-height:154px; display:grid; place-items:center; text-align:center; color:var(--hr-muted); padding:18px; }
#hr-staffing-prototype .detail-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; flex-wrap:wrap; margin-bottom:14px; }
#hr-staffing-prototype .breadcrumb { color:var(--hr-muted); font-size:13px; margin-bottom:10px; }
#hr-staffing-prototype .table-wrap { overflow-x:auto; }
#hr-staffing-prototype table { width:100%; border-collapse:collapse; font-size:13px; }
#hr-staffing-prototype th, #hr-staffing-prototype td { padding:10px 12px; border-bottom:1px solid var(--hr-line); text-align:left; vertical-align:middle; }
#hr-staffing-prototype th { color:var(--hr-muted); font-weight:500; background:var(--hr-soft); }
#hr-staffing-prototype td.num, #hr-staffing-prototype th.num { text-align:right; font-variant-numeric:tabular-nums; }
#hr-staffing-prototype tr.clickable { cursor:pointer; }
#hr-staffing-prototype tr.clickable:hover { background:color-mix(in srgb,var(--hr-blue) 8%,transparent); }
#hr-staffing-prototype .badge { display:inline-flex; align-items:center; border:1px solid var(--hr-line); border-radius:999px; padding:2px 7px; font-size:12px; color:var(--hr-muted); white-space:nowrap; margin-left:6px; }
#hr-staffing-prototype .badge.warn { color:var(--hr-amber); border-color:color-mix(in srgb,var(--hr-amber) 44%,var(--hr-line)); }
#hr-staffing-prototype .people { margin-top:14px; }
#hr-staffing-prototype .check-grid { display:grid; grid-template-columns:repeat(4,minmax(120px,1fr)); gap:10px; margin-bottom:14px; }
#hr-staffing-prototype .check-tables { display:grid; grid-template-columns:1fr 1.25fr; gap:14px; align-items:start; }
@media (max-width:840px) {
  #hr-staffing-prototype .title-row { flex-direction:column; }
  #hr-staffing-prototype .kpis { grid-template-columns:repeat(2,minmax(0,1fr)); }
  #hr-staffing-prototype .home-layout, #hr-staffing-prototype .check-tables { grid-template-columns:1fr; }
  #hr-staffing-prototype .port-grid { grid-template-columns:1fr; }
  #hr-staffing-prototype .check-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
}
&lt;/style&gt;

on&quot;:&quot;课程顾问&quot;,&quot;count&quot;:1},{&quot;lvl2&quot;:&quot;增长中心&quot;,&quot;lvl3&quot;:&quot;线下市场组&quot;,&quot;position&quot;:&quot;市场专员&quot;,&quot;count&quot;:1},{&quot;lvl2&quot;:&quot;西北区&quot;,&quot;lvl3&quot;:&quot;知春路分中心&quot;,&quot;position&quot;:&quot;课程顾问&quot;,&quot;count&quot;:1},{&quot;lvl2&quot;:&quot;高中项目&quot;,&quot;lvl3&quot;:&quot;高中文综项目&quot;,&quot;position&quot;:&quot;教师&quot;,&quot;count&quot;:1}],&quot;leaverRange&quot;:&quot;2026-08-10 ~ 2026-08-16&quot;},&quot;checks&quot;:{&quot;unmatchedPeople&quot;:3,&quot;unmatchedCombos&quot;:2,&quot;unmappedPeople&quot;:2,&quot;unmappedPositions&quot;:1,&quot;unmappedList&quot;:[{&quot;position&quot;:&quot;升学规划师&quot;,&quot;count&quot;:2}],&quot;comboList&quot;:[{&quot;lvl2&quot;:&quot;增长中心&quot;,&quot;lvl3&quot;:&quot;升学规划组&quot;,&quot;lvl4&quot;:&quot;—&quot;,&quot;position&quot;:&quot;升学规划师&quot;,&quot;count&quot;:2},{&quot;lvl2&quot;:&quot;增长中心&quot;,&quot;lvl3&quot;:&quot;学科运营组&quot;,&quot;lvl4&quot;:&quot;政策运营组&quot;,&quot;position&quot;:&quot;家庭教育指导（高级）专员&quot;,&quot;count&quot;:1}]}};
const root = document.getElementById(&#x27;hr-staffing-prototype&#x27;);
const $ = id =&gt; root.querySelector(&#x27;#&#x27; + id);
const fmt = n =&gt; Number(n || 0).toLocaleString(&#x27;zh-CN&#x27;);
const pct = n =&gt; `${Number(n || 0).toFixed(1)}%`;
const dash = model.meta.dash;
let state = { port:null, level:&#x27;home&#x27;, lvl2:null, lvl3:null, lvl4:null, rows:[] };

function kpi(label, value, sub, danger=false) {
  return `&lt;div class=&quot;kpi ${danger ? &#x27;danger&#x27; : &#x27;&#x27;}&quot;&gt;&lt;span&gt;${label}&lt;/span&gt;&lt;strong&gt;${value}&lt;/strong&gt;&lt;small&gt;${sub || &#x27;&#x27;}&lt;/small&gt;&lt;/div&gt;`;
}

function sumRows(rows) {
  const s = { official:0, temp:0, budget:0, onboard:0, three:0 };
  rows.forEach(r =&gt; Object.keys(s).forEach(k =&gt; s[k] += Number(r[k] || 0)));
  s.gap = Math.max(s.budget - s.onboard, 0);
  s.over = Math.max(s.onboard - s.budget, 0);
  s.fullRate = s.budget ? s.onboard / s.budget * 100 : 0;
  return s;
}

function visibleRows() {
  const port = $(&#x27;port-filter&#x27;).value;
  const pos = $(&#x27;position-filter&#x27;).value;
  const status = $(&#x27;status-filter&#x27;).value;
  return model.rows.filter(r =&gt;
    (port === &#x27;all&#x27; || r.port === port) &amp;&amp;
    (pos === &#x27;all&#x27; || r.position === pos) &amp;&amp;
    (status === &#x27;all&#x27; || (status === &#x27;gap&#x27; &amp;&amp; r.gap &gt; 0) || (status === &#x27;over&#x27; &amp;&amp; r.over &gt; 0) || (status === &#x27;temp&#x27; &amp;&amp; r.temp &gt; 0))
  );
}

function renderKpis(target, rows, useActualTotal=false) {
  const s = sumRows(rows);
  const onboard = useActualTotal ? model.totals.onboard : s.onboard;
  const rate = s.budget ? onboard / s.budget * 100 : 0;
  const balanceGap = Math.max(s.budget - onboard, 0);
  const balanceOver = Math.max(onboard - s.budget, 0);
  $(target).innerHTML = [
    kpi(&#x27;总编制&#x27;, fmt(s.budget), `正式 ${fmt(s.official)} / 临时 ${fmt(s.temp)}`),
    kpi(&#x27;在岗人数&#x27;, fmt(onboard), useActualTotal ? `已匹配 ${fmt(model.totals.assigned)} 人` : &#x27;&#x27;),
    kpi(&#x27;满编率&#x27;, pct(rate), &#x27;在岗 / 总编制&#x27;),
    kpi(&#x27;空编人数&#x27;, fmt(balanceGap), &#x27;&#x27;, balanceGap &gt; 0),
    kpi(&#x27;超编人数&#x27;, fmt(balanceOver), &#x27;&#x27;, balanceOver &gt; 0),
    kpi(&#x27;临时编制&#x27;, fmt(s.temp), s.three ? `三期 ${fmt(s.three)} 人` : &#x27;三期人员在对应岗位展示&#x27;)
  ].join(&#x27;&#x27;);
}

function metricCells(x) {
  const rate = x.budget ? x.onboard / x.budget * 100 : 0;
  return `&lt;td class=&quot;num&quot;&gt;${fmt(x.budget)}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${fmt(x.onboard)}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${pct(rate)}&lt;/td&gt;&lt;td class=&quot;num danger-text&quot;&gt;${x.gap ? fmt(x.gap) : &#x27;&#x27;}&lt;/td&gt;&lt;td class=&quot;num danger-text&quot;&gt;${x.over ? fmt(x.over) : &#x27;&#x27;}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${x.temp ? fmt(x.temp) : &#x27;&#x27;}&lt;/td&gt;`;
}

function groupRows(rows, key) {
  const map = new Map();
  rows.forEach(r =&gt; {
    const name = r[key] || dash;
    if (!map.has(name)) map.set(name, { name, official:0, temp:0, budget:0, onboard:0, three:0, rows:[] });
    const g = map.get(name);
    [&#x27;official&#x27;,&#x27;temp&#x27;,&#x27;budget&#x27;,&#x27;onboard&#x27;,&#x27;three&#x27;].forEach(k =&gt; g[k] += Number(r[k] || 0));
    g.rows.push(r);
  });
  return Array.from(map.values()).map(g =&gt; {
    g.gap = Math.max(g.budget - g.onboard, 0);
    g.over = Math.max(g.onboard - g.budget, 0);
    return g;
  }).sort((a,b) =&gt; b.budget - a.budget || a.name.localeCompare(b.name, &#x27;zh-CN&#x27;));
}

function populateFilters() {
  const activePorts = model.ports.filter(p =&gt; model.rows.some(r =&gt; r.port === p));
  $(&#x27;port-filter&#x27;).innerHTML = `&lt;option value=&quot;all&quot;&gt;全部端口&lt;/option&gt;` + activePorts.map(p =&gt; `&lt;option value=&quot;${p}&quot;&gt;${p}&lt;/option&gt;`).join(&#x27;&#x27;);
  const positions = Array.from(new Set(model.rows.map(r =&gt; r.position))).sort((a,b) =&gt; a.localeCompare(b, &#x27;zh-CN&#x27;));
  $(&#x27;position-filter&#x27;).innerHTML = `&lt;option value=&quot;all&quot;&gt;全部岗位&lt;/option&gt;` + positions.map(p =&gt; `&lt;option value=&quot;${p}&quot;&gt;${p}&lt;/option&gt;`).join(&#x27;&#x27;);
}

function renderHome() {
  const rows = visibleRows();
  const allFilters = $(&#x27;port-filter&#x27;).value === &#x27;all&#x27; &amp;&amp; $(&#x27;position-filter&#x27;).value === &#x27;all&#x27; &amp;&amp; $(&#x27;status-filter&#x27;).value === &#x27;all&#x27;;
  renderKpis(&#x27;home-kpis&#x27;, rows, allFilters);
  renderMovements();
  const ports = groupRows(rows, &#x27;port&#x27;).filter(g =&gt; g.budget || g.onboard);
  $(&#x27;port-grid&#x27;).innerHTML = ports.map(p =&gt; `
    &lt;button type=&quot;button&quot; class=&quot;port-card&quot; data-port=&quot;${p.name}&quot;&gt;
      &lt;div class=&quot;port-head&quot;&gt;&lt;div&gt;&lt;div class=&quot;port-name&quot;&gt;${p.name}&lt;/div&gt;&lt;p class=&quot;muted&quot;&gt;${p.rows.length} 个编制岗位组合&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;port-rate&quot;&gt;${pct(p.budget ? p.onboard / p.budget * 100 : 0)}&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;port-metrics&quot;&gt;
        &lt;div class=&quot;mini&quot;&gt;&lt;span&gt;总编制&lt;/span&gt;&lt;strong&gt;${fmt(p.budget)}&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;mini&quot;&gt;&lt;span&gt;在岗&lt;/span&gt;&lt;strong&gt;${fmt(p.onboard)}&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;mini&quot;&gt;&lt;span&gt;临时&lt;/span&gt;&lt;strong&gt;${fmt(p.temp)}&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;mini&quot;&gt;&lt;span&gt;空编&lt;/span&gt;&lt;strong class=&quot;danger-text&quot;&gt;${p.gap ? fmt(p.gap) : &#x27;-&#x27;}&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;mini&quot;&gt;&lt;span&gt;超编&lt;/span&gt;&lt;strong class=&quot;danger-text&quot;&gt;${p.over ? fmt(p.over) : &#x27;-&#x27;}&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;mini&quot;&gt;&lt;span&gt;三期&lt;/span&gt;&lt;strong&gt;${p.three ? fmt(p.three) : &#x27;-&#x27;}&lt;/strong&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/button&gt;
  `).join(&#x27;&#x27;) || `&lt;p class=&quot;muted&quot; style=&quot;padding:14px&quot;&gt;当前筛选下没有数据&lt;/p&gt;`;
  root.querySelectorAll(&#x27;.port-card&#x27;).forEach(card =&gt; card.addEventListener(&#x27;click&#x27;, () =&gt; openPort(card.dataset.port)));
}

function movementRows(items) {
  return items.map(x =&gt; `
    &lt;div class=&quot;movement-row&quot;&gt;
      &lt;div class=&quot;movement-main&quot;&gt;
        &lt;div class=&quot;movement-pos&quot;&gt;${x.position}&lt;/div&gt;
        &lt;div class=&quot;movement-org&quot;&gt;${x.lvl2 || dash} / ${x.lvl3 || dash}&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;movement-count&quot;&gt;${fmt(x.count)} 人&lt;/div&gt;
    &lt;/div&gt;
  `).join(&#x27;&#x27;);
}

function renderMovementCard(title, subtitle, items, emptyText) {
  const total = items.reduce((sum, x) =&gt; sum + Number(x.count || 0), 0);
  return `
    &lt;section class=&quot;movement-card&quot;&gt;
      &lt;div class=&quot;movement-card-head&quot;&gt;
        &lt;div&gt;&lt;div class=&quot;movement-card-title&quot;&gt;${title}&lt;/div&gt;&lt;p class=&quot;muted&quot;&gt;${subtitle}&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;movement-total&quot;&gt;${fmt(total)}&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;movement-list&quot;&gt;${items.length ? movementRows(items) : `&lt;div class=&quot;movement-row&quot;&gt;&lt;div class=&quot;muted&quot;&gt;${emptyText}&lt;/div&gt;&lt;div&gt;&lt;/div&gt;&lt;/div&gt;`}&lt;/div&gt;
    &lt;/section&gt;
  `;
}

function renderMovements() {
  const movement = model.movements || { onboarding:[], leavers:[], leaverRange:&#x27;&#x27; };
  $(&#x27;movement-stack&#x27;).innerHTML = [
    renderMovementCard(&#x27;本周待入职&#x27;, &#x27;按二级部门 / 三级部门 / 岗位汇总&#x27;, movement.onboarding || [], &#x27;本周暂无待入职人员&#x27;),
    renderMovementCard(&#x27;上周离职人员&#x27;, `${movement.leaverRange || &#x27;上一自然周&#x27;}`, movement.leavers || [], &#x27;上周暂无离职人员&#x27;)
  ].join(&#x27;&#x27;);
}

function openPort(port) {
  state = { port, level:&#x27;lvl2&#x27;, lvl2:null, lvl3:null, lvl4:null, rows:model.rows.filter(r =&gt; r.port === port) };
  $(&#x27;home-panel&#x27;).classList.add(&#x27;hidden&#x27;);
  $(&#x27;detail-panel&#x27;).classList.remove(&#x27;hidden&#x27;);
  $(&#x27;back-home&#x27;).classList.remove(&#x27;hidden&#x27;);
  $(&#x27;people-panel&#x27;).classList.add(&#x27;hidden&#x27;);
  $(&#x27;detail-title&#x27;).textContent = `${port}`;
  $(&#x27;detail-subtitle&#x27;).textContent = &#x27;先看二级部门，再继续展开到三级、四级、岗位和人员&#x27;;
  renderKpis(&#x27;detail-kpis&#x27;, state.rows, false);
  renderDrill();
}

function breadcrumb() {
  const parts = [state.port];
  if (state.lvl2) parts.push(state.lvl2);
  if (state.lvl3) parts.push(displayLevelName(&#x27;lvl3&#x27;, state.lvl3));
  if (state.lvl4) parts.push(displayLevelName(&#x27;lvl4&#x27;, state.lvl4));
  return parts.join(&#x27; / &#x27;);
}

function displayLevelName(key, name) {
  if (name !== dash) return name;
  if (key === &#x27;lvl3&#x27;) return `${state.lvl2}直属`;
  if (key === &#x27;lvl4&#x27;) return `${state.lvl3 &amp;&amp; state.lvl3 !== dash ? state.lvl3 : state.lvl2}直属`;
  return name;
}

function renderDrill() {
  $(&#x27;breadcrumb&#x27;).textContent = breadcrumb();
  $(&#x27;up&#x27;).classList.toggle(&#x27;hidden&#x27;, state.level === &#x27;lvl2&#x27;);
  $(&#x27;people-panel&#x27;).classList.add(&#x27;hidden&#x27;);
  if (state.level === &#x27;lvl2&#x27;) return renderGroup(&#x27;displayL2&#x27;, &#x27;二级部门在编情况&#x27;, &#x27;二级部门&#x27;);
  if (state.level === &#x27;lvl3&#x27;) return renderGroup(&#x27;lvl3&#x27;, &#x27;三级部门在编情况&#x27;, &#x27;三级部门&#x27;);
  if (state.level === &#x27;lvl4&#x27;) return renderGroup(&#x27;lvl4&#x27;, &#x27;四级部门在编情况&#x27;, &#x27;四级部门&#x27;);
  return renderPositions();
}

function currentRowsForGroup() {
  return state.rows.filter(r =&gt;
    (!state.lvl2 || r.displayL2 === state.lvl2) &amp;&amp;
    (!state.lvl3 || r.lvl3 === state.lvl3) &amp;&amp;
    (!state.lvl4 || r.lvl4 === state.lvl4)
  );
}

function renderGroup(key, title, label) {
  const rows = currentRowsForGroup();
  const groups = groupRows(rows, key);
  $(&#x27;drill-title&#x27;).textContent = title;
  $(&#x27;drill-hint&#x27;).textContent = &#x27;点击行继续下钻&#x27;;
  $(&#x27;drill-head&#x27;).innerHTML = `&lt;tr&gt;&lt;th&gt;${label}&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;总编制&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;在岗&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;满编率&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;空编&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;超编&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;临时编制&lt;/th&gt;&lt;/tr&gt;`;
  $(&#x27;drill-body&#x27;).innerHTML = groups.map(g =&gt; `&lt;tr class=&quot;clickable&quot; data-name=&quot;${g.name}&quot;&gt;&lt;td&gt;${displayLevelName(key, g.name)}&lt;/td&gt;${metricCells(g)}&lt;/tr&gt;`).join(&#x27;&#x27;) || `&lt;tr&gt;&lt;td colspan=&quot;7&quot; class=&quot;muted&quot;&gt;当前层级没有可展开数据&lt;/td&gt;&lt;/tr&gt;`;
  root.querySelectorAll(&#x27;#drill-body tr[data-name]&#x27;).forEach(tr =&gt; tr.addEventListener(&#x27;click&#x27;, () =&gt; drillInto(tr.dataset.name)));
}

function drillInto(name) {
  if (state.level === &#x27;lvl2&#x27;) {
    state.lvl2 = name;
    const sub = currentRowsForGroup();
    state.level = sub.some(r =&gt; r.lvl3 !== dash) ? &#x27;lvl3&#x27; : &#x27;positions&#x27;;
  } else if (state.level === &#x27;lvl3&#x27;) {
    state.lvl3 = name;
    const sub = currentRowsForGroup();
    state.level = sub.some(r =&gt; r.lvl4 !== dash) ? &#x27;lvl4&#x27; : &#x27;positions&#x27;;
  } else if (state.level === &#x27;lvl4&#x27;) {
    state.lvl4 = name;
    state.level = &#x27;positions&#x27;;
  }
  renderDrill();
}

function renderPositions() {
  const rows = currentRowsForGroup().slice().sort((a,b) =&gt; b.budget - a.budget || a.position.localeCompare(b.position, &#x27;zh-CN&#x27;));
  $(&#x27;drill-title&#x27;).textContent = &#x27;岗位明细&#x27;;
  $(&#x27;drill-hint&#x27;).textContent = &#x27;点击岗位查看在岗人员明细&#x27;;
  $(&#x27;drill-head&#x27;).innerHTML = `&lt;tr&gt;&lt;th&gt;岗位&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;正式编制&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;临时编制&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;总编制&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;在岗&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;满编率&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;空编&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;超编&lt;/th&gt;&lt;/tr&gt;`;
  $(&#x27;drill-body&#x27;).innerHTML = rows.map(r =&gt; `
    &lt;tr class=&quot;clickable&quot; data-row=&quot;${r.id}&quot;&gt;
      &lt;td&gt;${r.position}${r.temp || r.three ? &#x27;&lt;span class=&quot;badge warn&quot;&gt;临时/三期&lt;/span&gt;&#x27; : &#x27;&#x27;}&lt;/td&gt;
      &lt;td class=&quot;num&quot;&gt;${fmt(r.official)}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${r.temp ? fmt(r.temp) : &#x27;&#x27;}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${fmt(r.budget)}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${fmt(r.onboard)}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${pct(r.fullRate)}&lt;/td&gt;&lt;td class=&quot;num danger-text&quot;&gt;${r.gap ? fmt(r.gap) : &#x27;&#x27;}&lt;/td&gt;&lt;td class=&quot;num danger-text&quot;&gt;${r.over ? fmt(r.over) : &#x27;&#x27;}&lt;/td&gt;
    &lt;/tr&gt;
  `).join(&#x27;&#x27;) || `&lt;tr&gt;&lt;td colspan=&quot;8&quot; class=&quot;muted&quot;&gt;当前层级没有岗位数据&lt;/td&gt;&lt;/tr&gt;`;
  root.querySelectorAll(&#x27;#drill-body tr[data-row]&#x27;).forEach(tr =&gt; tr.addEventListener(&#x27;click&#x27;, () =&gt; openPeople(tr.dataset.row)));
}

function goUp() {
  if (state.level === &#x27;positions&#x27; &amp;&amp; state.lvl4) { state.lvl4 = null; state.level = &#x27;lvl4&#x27;; }
  else if (state.level === &#x27;positions&#x27; &amp;&amp; state.lvl3) { state.lvl3 = null; state.level = &#x27;lvl3&#x27;; }
  else if (state.level === &#x27;positions&#x27;) { state.lvl2 = null; state.level = &#x27;lvl2&#x27;; }
  else if (state.level === &#x27;lvl4&#x27;) { state.lvl3 = null; state.level = &#x27;lvl3&#x27;; }
  else if (state.level === &#x27;lvl3&#x27;) { state.lvl2 = null; state.level = &#x27;lvl2&#x27;; }
  renderDrill();
}

function openPeople(id) {
  const row = model.rows.find(r =&gt; r.id === id);
  if (!row) return;
  $(&#x27;people-panel&#x27;).classList.remove(&#x27;hidden&#x27;);
  $(&#x27;people-title&#x27;).textContent = `${row.position} - 人员明细`;
  $(&#x27;people-note&#x27;).textContent = `当前在岗 ${row.employeeTotal} 人`;
  $(&#x27;people-body&#x27;).innerHTML = row.employees.length ? row.employees.map(e =&gt; `&lt;tr&gt;&lt;td&gt;${e.id}&lt;/td&gt;&lt;td&gt;${e.name}&lt;/td&gt;&lt;td&gt;${e.position}&lt;/td&gt;&lt;td&gt;${e.entryDate}&lt;/td&gt;&lt;td&gt;${e.threeStatus ? &#x27;&lt;span class=&quot;badge warn&quot;&gt;&#x27; + e.threeStatus + &#x27;&lt;/span&gt;&#x27; : &#x27;&#x27;}&lt;/td&gt;&lt;td&gt;${e.returnDate || &#x27;&#x27;}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;) : `&lt;tr&gt;&lt;td colspan=&quot;6&quot; class=&quot;muted&quot;&gt;当前岗位暂无在岗人员&lt;/td&gt;&lt;/tr&gt;`;
  $(&#x27;people-panel&#x27;).scrollIntoView({ behavior:&#x27;smooth&#x27;, block:&#x27;nearest&#x27; });
}

function renderChecks() {
  const c = model.checks;
  $(&#x27;check-kpis&#x27;).innerHTML = [
    kpi(&#x27;待处理人员&#x27;, fmt(c.unmatchedPeople), &#x27;组织+岗位未匹配&#x27;, c.unmatchedPeople &gt; 0),
    kpi(&#x27;待处理组合&#x27;, fmt(c.unmatchedCombos), &#x27;按组合去重&#x27;),
    kpi(&#x27;未映射岗位人数&#x27;, fmt(c.unmappedPeople), &#x27;岗位名称问题&#x27;, c.unmappedPeople &gt; 0),
    kpi(&#x27;未映射岗位数&#x27;, fmt(c.unmappedPositions), &#x27;需补映射&#x27;)
  ].join(&#x27;&#x27;);
  $(&#x27;unmapped-body&#x27;).innerHTML = c.unmappedList.length ? c.unmappedList.map(x =&gt; `&lt;tr&gt;&lt;td&gt;${x.position}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${fmt(x.count)}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;) : `&lt;tr&gt;&lt;td colspan=&quot;2&quot; class=&quot;muted&quot;&gt;暂无未映射岗位&lt;/td&gt;&lt;/tr&gt;`;
  $(&#x27;combo-body&#x27;).innerHTML = c.comboList.length ? c.comboList.map(x =&gt; `&lt;tr&gt;&lt;td&gt;${x.lvl2}&lt;/td&gt;&lt;td&gt;${x.lvl3}&lt;/td&gt;&lt;td&gt;${x.lvl4}&lt;/td&gt;&lt;td&gt;${x.position}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${fmt(x.count)}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;) : `&lt;tr&gt;&lt;td colspan=&quot;5&quot; class=&quot;muted&quot;&gt;暂无无编制组合&lt;/td&gt;&lt;/tr&gt;`;
}

function switchView(view) {
  root.querySelectorAll(&#x27;.tab&#x27;).forEach(btn =&gt; btn.setAttribute(&#x27;aria-pressed&#x27;, btn.dataset.view === view ? &#x27;true&#x27; : &#x27;false&#x27;));
  $(&#x27;overview-view&#x27;).classList.toggle(&#x27;hidden&#x27;, view !== &#x27;overview&#x27;);
  $(&#x27;checks-view&#x27;).classList.toggle(&#x27;hidden&#x27;, view !== &#x27;checks&#x27;);
  if (view === &#x27;checks&#x27;) renderChecks(); else renderHome();
}

$(&#x27;hrp-date&#x27;).textContent = `数据日期：${model.meta.date}`;
populateFilters();
renderHome();
renderChecks();
root.querySelectorAll(&#x27;.tab&#x27;).forEach(btn =&gt; btn.addEventListener(&#x27;click&#x27;, () =&gt; switchView(btn.dataset.view)));
[&#x27;port-filter&#x27;,&#x27;position-filter&#x27;,&#x27;status-filter&#x27;].forEach(id =&gt; $(id).addEventListener(&#x27;change&#x27;, () =&gt; { $(&#x27;home-panel&#x27;).classList.remove(&#x27;hidden&#x27;); $(&#x27;detail-panel&#x27;).classList.add(&#x27;hidden&#x27;); $(&#x27;up&#x27;).classList.add(&#x27;hidden&#x27;); $(&#x27;back-home&#x27;).classList.add(&#x27;hidden&#x27;); renderHome(); }));
$(&#x27;reset&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { $(&#x27;port-filter&#x27;).value=&#x27;all&#x27;; $(&#x27;position-filter&#x27;).value=&#x27;all&#x27;; $(&#x27;status-filter&#x27;).value=&#x27;all&#x27;; $(&#x27;home-panel&#x27;).classList.remove(&#x27;hidden&#x27;); $(&#x27;detail-panel&#x27;).classList.add(&#x27;hidden&#x27;); $(&#x27;up&#x27;).classList.add(&#x27;hidden&#x27;); $(&#x27;back-home&#x27;).classList.add(&#x27;hidden&#x27;); renderHome(); });
$(&#x27;back-home&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { $(&#x27;home-panel&#x27;).classList.remove(&#x27;hidden&#x27;); $(&#x27;detail-panel&#x27;).classList.add(&#x27;hidden&#x27;); $(&#x27;up&#x27;).classList.add(&#x27;hidden&#x27;); $(&#x27;back-home&#x27;).classList.add(&#x27;hidden&#x27;); });
$(&#x27;up&#x27;).addEventListener(&#x27;click&#x27;, goUp);
})();
&lt;/script&gt;

&lt;script&gt;

    window.FloatingUIDOM;

  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;

  let autoUpdateCleanup = null;

        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;

      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0

      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {

    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);

  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
