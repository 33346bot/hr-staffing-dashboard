  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {

  ) {

  }

  .form-check-input::after {

  }

  .form-check-label {

  }

    height: 44px;
  }

  }
}

svg {

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  height: var(--icon-size) !important;

.text-warning,

}

&lt;style&gt;

&lt;script&gt;
window.initHrReport = function(root, report, files) {
  const download = (kind) =&gt; {
    const file = files &amp;&amp; files[kind];
    if (!file || !file.base64) return;
    const raw = atob(file.base64);
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i &lt; raw.length; i += 1) bytes[i] = raw.charCodeAt(i);
    const blob = new Blob([bytes], { type: file.mime });
    const url = URL.createObjectURL(blob);
    const link = document.createElement(&#x27;a&#x27;);
    link.href = url;
    link.download = file.filename;
    link.rel = &#x27;noopener&#x27;;
    link.click();
    setTimeout(() =&gt; URL.revokeObjectURL(url), 1000);
  };
  const xlsx = root.querySelector(&#x27;#export-xlsx&#x27;);
  const pdf = root.querySelector(&#x27;#export-pdf&#x27;);
  if (!files || !files.xlsx || !files.pdf) {
    [xlsx, pdf].forEach(button =&gt; { if (button) button.disabled = true; });
    return;

const root = document.getElementById(&#x27;hr-staffing-prototype&#x27;);
const $ = id =&gt; root.querySelector(&#x27;#&#x27; + id);
const fmt = n =&gt; Number(n || 0).toLocaleString(&#x27;zh-CN&#x27;);
const pct = n =&gt; `${Number(n || 0).toFixed(1)}%`;
const dash = model.meta.dash;
let state = { port:null, level:&#x27;home&#x27;, lvl2:null, lvl3:null, lvl4:null, rows:[] };

function kpi(label, value, sub, danger=false) {
  return `&lt;div class=&quot;kpi ${danger ? &#x27;danger&#x27; : &#x27;&#x27;}&quot;&gt;&lt;span&gt;${label}&lt;/span&gt;&lt;strong&gt;${value}&lt;/strong&gt;&lt;small&gt;${sub || &#x27;&#x27;}&lt;/small&gt;&lt;/div&gt;`;
}

function sumRows(rows) {
  const s = { official:0, temp:0, budget:0, onboard:0, three:0 };
  rows.forEach(r =&gt; Object.keys(s).forEach(k =&gt; s[k] += Number(r[k] || 0)));
  s.gap = Math.max(s.budget - s.onboard, 0);
  s.over = Math.max(s.onboard - s.budget, 0);
  s.fullRate = s.budget ? s.onboard / s.budget * 100 : 0;
  return s;
}

function visibleRows() {
  const port = $(&#x27;port-filter&#x27;).value;
  const pos = $(&#x27;position-filter&#x27;).value;
  const status = $(&#x27;status-filter&#x27;).value;
  return model.rows.filter(r =&gt;
    (port === &#x27;all&#x27; || r.port === port) &amp;&amp;
    (pos === &#x27;all&#x27; || r.position === pos) &amp;&amp;
    (status === &#x27;all&#x27; || (status === &#x27;gap&#x27; &amp;&amp; r.gap &gt; 0) || (status === &#x27;over&#x27; &amp;&amp; r.over &gt; 0) || (status === &#x27;temp&#x27; &amp;&amp; r.temp &gt; 0))
  );
}

function renderKpis(target, rows, useActualTotal=false) {
  const s = sumRows(rows);
  const onboard = useActualTotal ? model.totals.onboard : s.onboard;
  const rate = s.budget ? onboard / s.budget * 100 : 0;
  const balanceGap = Math.max(s.budget - onboard, 0);
  const balanceOver = Math.max(onboard - s.budget, 0);
  $(target).innerHTML = [
    kpi(&#x27;总编制&#x27;, fmt(s.budget), `正式 ${fmt(s.official)} / 临时 ${fmt(s.temp)}`),
    kpi(&#x27;在岗人数&#x27;, fmt(onboard), useActualTotal ? `已匹配 ${fmt(model.totals.assigned)} 人` : &#x27;&#x27;),
    kpi(&#x27;满编率&#x27;, pct(rate), &#x27;在岗 / 总编制&#x27;),
    kpi(&#x27;空编人数&#x27;, fmt(balanceGap), &#x27;&#x27;, balanceGap &gt; 0),
    kpi(&#x27;超编人数&#x27;, fmt(balanceOver), &#x27;&#x27;, balanceOver &gt; 0),
    kpi(&#x27;临时编制&#x27;, fmt(s.temp), s.three ? `三期 ${fmt(s.three)} 人` : &#x27;三期人员在对应岗位展示&#x27;)
  ].join(&#x27;&#x27;);
}

function metricCells(x) {
  const rate = x.budget ? x.onboard / x.budget * 100 : 0;
  return `&lt;td class=&quot;num&quot;&gt;${fmt(x.budget)}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${fmt(x.onboard)}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${pct(rate)}&lt;/td&gt;&lt;td class=&quot;num danger-text&quot;&gt;${x.gap ? fmt(x.gap) : &#x27;&#x27;}&lt;/td&gt;&lt;td class=&quot;num danger-text&quot;&gt;${x.over ? fmt(x.over) : &#x27;&#x27;}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${x.temp ? fmt(x.temp) : &#x27;&#x27;}&lt;/td&gt;`;
}

function groupRows(rows, key) {
  const map = new Map();
  rows.forEach(r =&gt; {
    const name = r[key] || dash;
    if (!map.has(name)) map.set(name, { name, official:0, temp:0, budget:0, onboard:0, three:0, rows:[] });
    const g = map.get(name);
    [&#x27;official&#x27;,&#x27;temp&#x27;,&#x27;budget&#x27;,&#x27;onboard&#x27;,&#x27;three&#x27;].forEach(k =&gt; g[k] += Number(r[k] || 0));
    g.rows.push(r);
  });
  return Array.from(map.values()).map(g =&gt; {
    g.gap = Math.max(g.budget - g.onboard, 0);
    g.over = Math.max(g.onboard - g.budget, 0);
    return g;
  }).sort((a,b) =&gt; b.budget - a.budget || a.name.localeCompare(b.name, &#x27;zh-CN&#x27;));
}

function populateFilters() {
  const activePorts = model.ports.filter(p =&gt; model.rows.some(r =&gt; r.port === p));
  $(&#x27;port-filter&#x27;).innerHTML = `&lt;option value=&quot;all&quot;&gt;全部端口&lt;/option&gt;` + activePorts.map(p =&gt; `&lt;option value=&quot;${p}&quot;&gt;${p}&lt;/option&gt;`).join(&#x27;&#x27;);
  const positions = Array.from(new Set(model.rows.map(r =&gt; r.position))).sort((a,b) =&gt; a.localeCompare(b, &#x27;zh-CN&#x27;));
  $(&#x27;position-filter&#x27;).innerHTML = `&lt;option value=&quot;all&quot;&gt;全部岗位&lt;/option&gt;` + positions.map(p =&gt; `&lt;option value=&quot;${p}&quot;&gt;${p}&lt;/option&gt;`).join(&#x27;&#x27;);
}

function renderHome() {
  const rows = visibleRows();
  const allFilters = $(&#x27;port-filter&#x27;).value === &#x27;all&#x27; &amp;&amp; $(&#x27;position-filter&#x27;).value === &#x27;all&#x27; &amp;&amp; $(&#x27;status-filter&#x27;).value === &#x27;all&#x27;;
  renderKpis(&#x27;home-kpis&#x27;, rows, allFilters);
  renderMovements();
  const ports = groupRows(rows, &#x27;port&#x27;).filter(g =&gt; g.budget || g.onboard);
  $(&#x27;port-grid&#x27;).innerHTML = ports.map(p =&gt; `
    &lt;button type=&quot;button&quot; class=&quot;port-card&quot; data-port=&quot;${p.name}&quot;&gt;
      &lt;div class=&quot;port-head&quot;&gt;&lt;div&gt;&lt;div class=&quot;port-name&quot;&gt;${p.name}&lt;/div&gt;&lt;p class=&quot;muted&quot;&gt;${p.rows.length} 个编制岗位组合&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;port-rate&quot;&gt;${pct(p.budget ? p.onboard / p.budget * 100 : 0)}&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;port-metrics&quot;&gt;
        &lt;div class=&quot;mini&quot;&gt;&lt;span&gt;总编制&lt;/span&gt;&lt;strong&gt;${fmt(p.budget)}&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;mini&quot;&gt;&lt;span&gt;在岗&lt;/span&gt;&lt;strong&gt;${fmt(p.onboard)}&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;mini&quot;&gt;&lt;span&gt;临时&lt;/span&gt;&lt;strong&gt;${fmt(p.temp)}&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;mini&quot;&gt;&lt;span&gt;空编&lt;/span&gt;&lt;strong class=&quot;danger-text&quot;&gt;${p.gap ? fmt(p.gap) : &#x27;-&#x27;}&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;mini&quot;&gt;&lt;span&gt;超编&lt;/span&gt;&lt;strong class=&quot;danger-text&quot;&gt;${p.over ? fmt(p.over) : &#x27;-&#x27;}&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;mini&quot;&gt;&lt;span&gt;三期&lt;/span&gt;&lt;strong&gt;${p.three ? fmt(p.three) : &#x27;-&#x27;}&lt;/strong&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/button&gt;
  `).join(&#x27;&#x27;) || `&lt;p class=&quot;muted&quot; style=&quot;padding:14px&quot;&gt;当前筛选下没有数据&lt;/p&gt;`;
  root.querySelectorAll(&#x27;.port-card&#x27;).forEach(card =&gt; card.addEventListener(&#x27;click&#x27;, () =&gt; openPort(card.dataset.port)));
}

function movementRows(items) {
  return items.map(x =&gt; `
    &lt;div class=&quot;movement-row&quot;&gt;
      &lt;div class=&quot;movement-main&quot;&gt;
        &lt;div class=&quot;movement-pos&quot;&gt;${x.position}&lt;/div&gt;
        &lt;div class=&quot;movement-org&quot;&gt;${x.lvl2 || dash} / ${x.lvl3 || dash}&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;movement-count&quot;&gt;${fmt(x.count)} 人&lt;/div&gt;
    &lt;/div&gt;
  `).join(&#x27;&#x27;);
}

function renderMovementCard(title, subtitle, items, emptyText) {
  const total = items.reduce((sum, x) =&gt; sum + Number(x.count || 0), 0);
  return `
    &lt;section class=&quot;movement-card&quot;&gt;
      &lt;div class=&quot;movement-card-head&quot;&gt;
        &lt;div&gt;&lt;div class=&quot;movement-card-title&quot;&gt;${title}&lt;/div&gt;&lt;p class=&quot;muted&quot;&gt;${subtitle}&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;movement-total&quot;&gt;${fmt(total)}&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;movement-list&quot;&gt;${items.length ? movementRows(items) : `&lt;div class=&quot;movement-row&quot;&gt;&lt;div class=&quot;muted&quot;&gt;${emptyText}&lt;/div&gt;&lt;div&gt;&lt;/div&gt;&lt;/div&gt;`}&lt;/div&gt;
    &lt;/section&gt;
  `;
}

function renderMovements() {
  const movement = model.movements || { onboarding:[], leavers:[], recruiting:[], leaverRange:&#x27;&#x27; };
  $(&#x27;movement-stack&#x27;).innerHTML = [
    renderMovementCard(&#x27;招聘中缺口&#x27;, &#x27;按你提供的招聘中缺口表展示&#x27;, movement.recruiting || [], &#x27;暂无招聘中缺口&#x27;),
    renderMovementCard(&#x27;本周待入职&#x27;, &#x27;按二级部门 / 三级部门 / 岗位汇总&#x27;, movement.onboarding || [], &#x27;本周暂无待入职人员&#x27;),
    renderMovementCard(&#x27;上周离职人员&#x27;, `${movement.leaverRange || &#x27;上一自然周&#x27;}`, movement.leavers || [], &#x27;上周暂无离职人员&#x27;)
  ].join(&#x27;&#x27;);
}

function openPort(port) {
  state = { port, level:&#x27;lvl2&#x27;, lvl2:null, lvl3:null, lvl4:null, rows:model.rows.filter(r =&gt; r.port === port) };
  $(&#x27;home-panel&#x27;).classList.add(&#x27;hidden&#x27;);
  $(&#x27;detail-panel&#x27;).classList.remove(&#x27;hidden&#x27;);
  $(&#x27;back-home&#x27;).classList.remove(&#x27;hidden&#x27;);
  $(&#x27;people-panel&#x27;).classList.add(&#x27;hidden&#x27;);
  $(&#x27;detail-title&#x27;).textContent = `${port}`;
  $(&#x27;detail-subtitle&#x27;).textContent = &#x27;先看二级部门，再继续展开到三级、四级、岗位和人员&#x27;;
  renderKpis(&#x27;detail-kpis&#x27;, state.rows, false);
  renderDrill();
}

function breadcrumb() {
  const parts = [state.port];
  if (state.lvl2) parts.push(state.lvl2);
  if (state.lvl3) parts.push(displayLevelName(&#x27;lvl3&#x27;, state.lvl3));
  if (state.lvl4) parts.push(displayLevelName(&#x27;lvl4&#x27;, state.lvl4));
  return parts.join(&#x27; / &#x27;);
}

function displayLevelName(key, name) {
  if (name !== dash) return name;
  if (key === &#x27;lvl3&#x27;) return `${state.lvl2}直属`;
  if (key === &#x27;lvl4&#x27;) return `${state.lvl3 &amp;&amp; state.lvl3 !== dash ? state.lvl3 : state.lvl2}直属`;
  return name;
}

function renderDrill() {
  $(&#x27;breadcrumb&#x27;).textContent = breadcrumb();
  $(&#x27;up&#x27;).classList.toggle(&#x27;hidden&#x27;, state.level === &#x27;lvl2&#x27;);
  $(&#x27;people-panel&#x27;).classList.add(&#x27;hidden&#x27;);
  if (state.level === &#x27;lvl2&#x27;) return renderGroup(&#x27;displayL2&#x27;, &#x27;二级部门在编情况&#x27;, &#x27;二级部门&#x27;);
  if (state.level === &#x27;lvl3&#x27;) return renderGroup(&#x27;lvl3&#x27;, &#x27;三级部门在编情况&#x27;, &#x27;三级部门&#x27;);
  if (state.level === &#x27;lvl4&#x27;) return renderGroup(&#x27;lvl4&#x27;, &#x27;四级部门在编情况&#x27;, &#x27;四级部门&#x27;);
  return renderPositions();
}

function currentRowsForGroup() {
  return state.rows.filter(r =&gt;
    (!state.lvl2 || r.displayL2 === state.lvl2) &amp;&amp;
    (!state.lvl3 || r.lvl3 === state.lvl3) &amp;&amp;
    (!state.lvl4 || r.lvl4 === state.lvl4)
  );
}

function renderGroup(key, title, label) {
  const rows = currentRowsForGroup();
  const groups = groupRows(rows, key);
  $(&#x27;drill-title&#x27;).textContent = title;
  $(&#x27;drill-hint&#x27;).textContent = &#x27;点击行继续下钻&#x27;;
  $(&#x27;drill-head&#x27;).innerHTML = `&lt;tr&gt;&lt;th&gt;${label}&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;总编制&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;在岗&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;满编率&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;空编&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;超编&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;临时编制&lt;/th&gt;&lt;/tr&gt;`;
  $(&#x27;drill-body&#x27;).innerHTML = groups.map(g =&gt; `&lt;tr class=&quot;clickable&quot; data-name=&quot;${g.name}&quot;&gt;&lt;td&gt;${displayLevelName(key, g.name)}&lt;/td&gt;${metricCells(g)}&lt;/tr&gt;`).join(&#x27;&#x27;) || `&lt;tr&gt;&lt;td colspan=&quot;7&quot; class=&quot;muted&quot;&gt;当前层级没有可展开数据&lt;/td&gt;&lt;/tr&gt;`;
  root.querySelectorAll(&#x27;#drill-body tr[data-name]&#x27;).forEach(tr =&gt; tr.addEventListener(&#x27;click&#x27;, () =&gt; drillInto(tr.dataset.name)));
}

function drillInto(name) {
  if (state.level === &#x27;lvl2&#x27;) {
    state.lvl2 = name;
    const sub = currentRowsForGroup();
    state.level = sub.some(r =&gt; r.lvl3 !== dash) ? &#x27;lvl3&#x27; : &#x27;positions&#x27;;
  } else if (state.level === &#x27;lvl3&#x27;) {
    state.lvl3 = name;
    const sub = currentRowsForGroup();
    state.level = sub.some(r =&gt; r.lvl4 !== dash) ? &#x27;lvl4&#x27; : &#x27;positions&#x27;;
  } else if (state.level === &#x27;lvl4&#x27;) {
    state.lvl4 = name;
    state.level = &#x27;positions&#x27;;
  }
  renderDrill();
}

function renderPositions() {
  const rows = currentRowsForGroup().slice().sort((a,b) =&gt; b.budget - a.budget || a.position.localeCompare(b.position, &#x27;zh-CN&#x27;));
  $(&#x27;drill-title&#x27;).textContent = &#x27;岗位明细&#x27;;
  $(&#x27;drill-hint&#x27;).textContent = &#x27;点击岗位查看在岗人员明细&#x27;;
  $(&#x27;drill-head&#x27;).innerHTML = `&lt;tr&gt;&lt;th&gt;岗位&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;正式编制&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;临时编制&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;总编制&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;在岗&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;满编率&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;空编&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;超编&lt;/th&gt;&lt;/tr&gt;`;
  $(&#x27;drill-body&#x27;).innerHTML = rows.map(r =&gt; `
    &lt;tr class=&quot;clickable&quot; data-row=&quot;${r.id}&quot;&gt;
      &lt;td&gt;${r.position}${r.temp || r.three ? &#x27;&lt;span class=&quot;badge warn&quot;&gt;临时/三期&lt;/span&gt;&#x27; : &#x27;&#x27;}&lt;/td&gt;
      &lt;td class=&quot;num&quot;&gt;${fmt(r.official)}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${r.temp ? fmt(r.temp) : &#x27;&#x27;}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${fmt(r.budget)}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${fmt(r.onboard)}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${pct(r.fullRate)}&lt;/td&gt;&lt;td class=&quot;num danger-text&quot;&gt;${r.gap ? fmt(r.gap) : &#x27;&#x27;}&lt;/td&gt;&lt;td class=&quot;num danger-text&quot;&gt;${r.over ? fmt(r.over) : &#x27;&#x27;}&lt;/td&gt;
    &lt;/tr&gt;
  `).join(&#x27;&#x27;) || `&lt;tr&gt;&lt;td colspan=&quot;8&quot; class=&quot;muted&quot;&gt;当前层级没有岗位数据&lt;/td&gt;&lt;/tr&gt;`;
  root.querySelectorAll(&#x27;#drill-body tr[data-row]&#x27;).forEach(tr =&gt; tr.addEventListener(&#x27;click&#x27;, () =&gt; openPeople(tr.dataset.row)));
}

function goUp() {
  if (state.level === &#x27;positions&#x27; &amp;&amp; state.lvl4) { state.lvl4 = null; state.level = &#x27;lvl4&#x27;; }
  else if (state.level === &#x27;positions&#x27; &amp;&amp; state.lvl3) { state.lvl3 = null; state.level = &#x27;lvl3&#x27;; }
  else if (state.level === &#x27;positions&#x27;) { state.lvl2 = null; state.level = &#x27;lvl2&#x27;; }
  else if (state.level === &#x27;lvl4&#x27;) { state.lvl3 = null; state.level = &#x27;lvl3&#x27;; }
  else if (state.level === &#x27;lvl3&#x27;) { state.lvl2 = null; state.level = &#x27;lvl2&#x27;; }
  renderDrill();
}

function openPeople(id) {
  const row = model.rows.find(r =&gt; r.id === id);
  if (!row) return;
  $(&#x27;people-panel&#x27;).classList.remove(&#x27;hidden&#x27;);
  $(&#x27;people-title&#x27;).textContent = `${row.position} - 人员明细`;
  $(&#x27;people-note&#x27;).textContent = `当前在岗 ${row.employeeTotal} 人`;
  $(&#x27;people-body&#x27;).innerHTML = row.employees.length ? row.employees.map(e =&gt; `&lt;tr&gt;&lt;td&gt;${e.id}&lt;/td&gt;&lt;td&gt;${e.name}&lt;/td&gt;&lt;td&gt;${e.position}&lt;/td&gt;&lt;td&gt;${e.entryDate}&lt;/td&gt;&lt;td&gt;${e.threeStatus ? &#x27;&lt;span class=&quot;badge warn&quot;&gt;&#x27; + e.threeStatus + &#x27;&lt;/span&gt;&#x27; : &#x27;&#x27;}&lt;/td&gt;&lt;td&gt;${e.returnDate || &#x27;&#x27;}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;) : `&lt;tr&gt;&lt;td colspan=&quot;6&quot; class=&quot;muted&quot;&gt;当前岗位暂无在岗人员&lt;/td&gt;&lt;/tr&gt;`;
  $(&#x27;people-panel&#x27;).scrollIntoView({ behavior:&#x27;smooth&#x27;, block:&#x27;nearest&#x27; });
}

function renderChecks() {
  const c = model.checks;
  $(&#x27;check-kpis&#x27;).innerHTML = [
    kpi(&#x27;待处理人员&#x27;, fmt(c.unmatchedPeople), &#x27;组织+岗位未匹配&#x27;, c.unmatchedPeople &gt; 0),
    kpi(&#x27;待处理组合&#x27;, fmt(c.unmatchedCombos), &#x27;按组合去重&#x27;),
    kpi(&#x27;未映射岗位人数&#x27;, fmt(c.unmappedPeople), &#x27;岗位名称问题&#x27;, c.unmappedPeople &gt; 0),
    kpi(&#x27;未映射岗位数&#x27;, fmt(c.unmappedPositions), &#x27;需补映射&#x27;)
  ].join(&#x27;&#x27;);
  $(&#x27;unmapped-body&#x27;).innerHTML = c.unmappedList.length ? c.unmappedList.map(x =&gt; `&lt;tr&gt;&lt;td&gt;${x.position}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${fmt(x.count)}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;) : `&lt;tr&gt;&lt;td colspan=&quot;2&quot; class=&quot;muted&quot;&gt;暂无未映射岗位&lt;/td&gt;&lt;/tr&gt;`;
  $(&#x27;combo-body&#x27;).innerHTML = c.comboList.length ? c.comboList.map(x =&gt; `&lt;tr&gt;&lt;td&gt;${x.lvl2}&lt;/td&gt;&lt;td&gt;${x.lvl3}&lt;/td&gt;&lt;td&gt;${x.lvl4}&lt;/td&gt;&lt;td&gt;${x.position}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${fmt(x.count)}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;) : `&lt;tr&gt;&lt;td colspan=&quot;5&quot; class=&quot;muted&quot;&gt;暂无无编制组合&lt;/td&gt;&lt;/tr&gt;`;
}

function switchView(view) {
  root.querySelectorAll(&#x27;.tab&#x27;).forEach(btn =&gt; btn.setAttribute(&#x27;aria-pressed&#x27;, btn.dataset.view === view ? &#x27;true&#x27; : &#x27;false&#x27;));
  $(&#x27;overview-view&#x27;).classList.toggle(&#x27;hidden&#x27;, view !== &#x27;overview&#x27;);
  $(&#x27;checks-view&#x27;).classList.toggle(&#x27;hidden&#x27;, view !== &#x27;checks&#x27;);
  if (view === &#x27;checks&#x27;) renderChecks(); else renderHome();
}

$(&#x27;hrp-date&#x27;).textContent = `数据日期：${model.meta.date}`;
populateFilters();
renderHome();
renderChecks();
